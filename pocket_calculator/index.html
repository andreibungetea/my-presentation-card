<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="general-container">
      <input type="number" class="input-container" />
      <button class="button-design selected-button" type="button" id="plus">
        +
      </button>
      <button class="button-design selected-button" type="button" id="minus">
        -
      </button>
      <button class="button-design selected-button" type="button" id="multiply">
        *
      </button>
      <button class="button-design selected-button" type="button" id="divide">
        /
      </button>
      <button class="button-design selected-button" type="button" id="equals">
        =
      </button>
      <button
        class="button-design selected-button reset-button"
        type="button"
        id="reset"
      >
        C
      </button>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
