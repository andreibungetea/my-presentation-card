<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentation card</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="presentation-card">
      <img src="./assets/cv image.png" class="presentation-card-image" />
      <h3 class="presentation-card-heading">Andrei Bungetea</h3>
      <p class="presentation-card-location">Bucharest, Romania</p>
      <p class="presentation-card-quote">
        "Front-end developer and avid reader."
      </p>
      <a
        href="https://github.com/andreibungetea"
        target="_blank"
        class="presentation-card-link"
        >GitHub</a
      >
      <a
        href="https://www.frontendmentor.io/"
        target="_blank"
        class="presentation-card-link"
        >Front-end mentor</a
      >
      <a
        href="https://www.linkedin.com/in/andrei-bungetea-88262ba9/"
        target="_blank"
        class="presentation-card-link"
        >LinkedIn</a
      >
      <a
        href="https://www.facebook.com/andreibungetea/"
        target="_blank"
        class="presentation-card-link"
        >Facebook</a
      >
      <a
        href="https://www.instagram.com/"
        target="_blank"
        class="presentation-card-link"
        >Instagram</a
      >
    </div>
  </body>
</html>
